name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  security-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=shopeasy-backend
            -Dsonar.projectName=shopeasy-backend

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:latest
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.90.149.239
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:latest
            docker stop shopeasy || true
            docker rm shopeasy || true
            docker run -d --name shopeasy -p 80:3000 \
              -e DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id shopeasy/db-password --region us-east-1 --query SecretString --output text | jq -r .password) \
              ${{ secrets.DOCKERHUB_USERNAME }}/shopeasy-backend:latest